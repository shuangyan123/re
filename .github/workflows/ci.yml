name: Tutor Benchmark CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate license and governance boundary
        run: npm run test:governance
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Run synthetic benchmark
        run: npm run benchmark
      - name: Build public website
        run: npm run website:build
      - name: Check public website artifact
        run: node scripts/website-artifact-smoke.mjs
      - name: Run package consumer smoke
        run: npm run test:package
