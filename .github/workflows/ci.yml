name: Tutor Benchmark CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Community Review service dependencies
        run: npm ci --prefix services/community-review-service
      - name: Validate license and governance boundary
        run: npm run test:governance
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck Community Review service foundation
        run: npm run typecheck:community-review-service
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test Community Review service foundation
        run: npm run test:community-review-service
      - name: Build
        run: npm run build
      - name: Run provider-free Quickstart
        run: npm run quickstart
      - name: Run synthetic benchmark
        run: npm run benchmark
      - name: Build public website
        run: npm run website:build
      - name: Check public website artifact
        run: node scripts/website-artifact-smoke.mjs
      - name: Run package consumer smoke
        run: npm run test:package

  community-review-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tutorbench_community_review
          POSTGRES_USER: tutorbench
          POSTGRES_PASSWORD: tutorbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorbench -d tutorbench_community_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Community Review service dependencies
        run: npm ci --prefix services/community-review-service
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run PostgreSQL integration and concurrency tests
        env:
          COMMUNITY_REVIEW_DATABASE_URL: postgresql://tutorbench:tutorbench@127.0.0.1:5432/tutorbench_community_review
          COMMUNITY_REVIEW_DATABASE_SSL: disable
          COMMUNITY_REVIEW_POSTGRES_TESTS: "1"
          COMMUNITY_REVIEW_ALLOW_TEST_RESET: "1"
        run: npm run test:community-review-service:postgres
      - name: Run backup and restore smoke
        env:
          COMMUNITY_REVIEW_DATABASE_URL: postgresql://tutorbench:tutorbench@127.0.0.1:5432/tutorbench_community_review
          COMMUNITY_REVIEW_BACKUP_RESTORE: "1"
        run: node scripts/community-review-backup-restore.mjs

  community-review-container:
    runs-on: ubuntu-latest
    needs: community-review-postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tutorbench_community_review
          POSTGRES_USER: tutorbench
          POSTGRES_PASSWORD: tutorbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorbench -d tutorbench_community_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Community Review container
        run: docker build --file services/community-review-service/Dockerfile --tag tutorbench-community-review:ci .
      - name: Run container migration
        run: >-
          docker run --rm --network host
          --env COMMUNITY_REVIEW_ENV=development
          --env COMMUNITY_REVIEW_STORAGE=postgres
          --env COMMUNITY_REVIEW_DATABASE_URL=postgresql://tutorbench:tutorbench@127.0.0.1:5432/tutorbench_community_review
          --env COMMUNITY_REVIEW_DATABASE_SSL=disable
          tutorbench-community-review:ci
          node services/community-review-service/dist/services/community-review-service/src/cli.js migrate
      - name: Verify container live and ready probes
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --network host \
            --env COMMUNITY_REVIEW_ENV=development \
            --env COMMUNITY_REVIEW_STORAGE=postgres \
            --env COMMUNITY_REVIEW_AUTH_MODE=synthetic \
            --env COMMUNITY_REVIEW_DATABASE_URL=postgresql://tutorbench:tutorbench@127.0.0.1:5432/tutorbench_community_review \
            --env COMMUNITY_REVIEW_DATABASE_SSL=disable \
            tutorbench-community-review:ci)"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health/live >/dev/null; then break; fi
            sleep 1
            if [ "$attempt" = "30" ]; then docker logs "$container_id"; exit 1; fi
          done
          curl --fail --silent http://127.0.0.1:8787/health/ready
