name: Tutor Benchmark Release Validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to validate when running manually"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check tag and package version
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' &&
            (startsWith(inputs.ref, 'refs/tags/') || startsWith(inputs.ref, 'v')))
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        shell: bash
        run: |
          tag="${RELEASE_REF#refs/tags/}"
          node scripts/validate-release-version.mjs "$tag"
      - name: Validate license and governance boundary
        run: npm run test:governance
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Run provider-free Quickstart
        run: npm run quickstart
      - name: Run synthetic benchmark
        run: npm run benchmark
      - name: Build public website
        run: npm run website:build
      - name: Check public website artifact
        run: node scripts/website-artifact-smoke.mjs
      - name: Run package consumer smoke and retain tarball
        run: node scripts/package-consumer-smoke.mjs --output-dir artifacts/release
      - name: Verify release candidate and emit report
        run: npm run release:verify
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutor-benchmark-${{ steps.package.outputs.version }}
          path: artifacts/release/tutor-benchmark-*.tgz
          if-no-files-found: error
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutor-benchmark-website-${{ steps.package.outputs.version }}
          path: website/dist
          if-no-files-found: error
      - name: Upload release candidate report
        uses: actions/upload-artifact@v4
        with:
          name: tutor-benchmark-release-candidate-${{ steps.package.outputs.version }}
          path: artifacts/release/release-candidate-report.json
          if-no-files-found: error
